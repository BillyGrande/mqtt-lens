name: Weekly scan

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - uses: erlef/setup-beam@988e02bfe678367a02564f65ca2e37726dc0268f # v1.9.0
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Fetch dependencies
        run: mix deps.get

      - name: Known CVEs in dependencies
        run: mix deps.audit

      - name: Retired packages
        run: mix hex.audit

      - name: Sobelow
        run: mix sobelow --exit --threshold low
