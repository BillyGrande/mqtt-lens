name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each push run has its own group (run_id), so no push range is skipped or cancelled.
  # Only PR runs share a group per ref and cancel in progress.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: test-tamper reads the commits of the PR

      - name: Test-tamper check (frozen test files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/test-tamper.sh "${PR_BASE}" "${PR_HEAD}"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      # make setup: deps.get, assets.setup, tool-sums.sh (SHA-256 of the binaries,
      # before they first run), then assets.build.
      - name: Fetch dependencies and check tool SHA-256
        run: make setup

      - name: "Unsafe pattern grep (raw, safe tuples, String.to_atom, atom keys)"
        run: scripts/ci/unsafe-grep.sh

      - name: make check
        run: make check

      - name: No native libraries in the prod build
        run: scripts/ci/no-native-libs.sh

  # Own job: the DENYLIST secret must never share a runner with dependency code
  # (setup-beam, cache, mix, tests). This job has checkout and bash scripts only.
  denylist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: the scan reads the commits of the PR

      # The scan skips only for PRs from forks (secrets are not available there).
      # In every other case an empty secret is a failure: the gate must not fail open.
      # Scope: the checked-out tree, all commit messages and the added lines of the PR
      # diff (base..head). The beads export scan stays in the local pre-push hook,
      # because CI has no beads data.
      - name: Deny-list scan
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "${IS_FORK}" = "true" ]; then
            echo "::notice::Pull request from a fork: the deny-list secret is not available, scan skipped."
            exit 0
          fi
          if [ -z "${DENYLIST}" ]; then
            echo "::error::The DENYLIST secret is empty or missing. Add the DENYLIST repository secret (Settings, Secrets and variables, Actions)."
            exit 1
          fi
          umask 077
          printf '%s\n' "${DENYLIST}" > "${RUNNER_TEMP}/denylist"
          export MQTTLENS_DENYLIST="${RUNNER_TEMP}/denylist"
          scripts/denylist-scan.sh
          if [ -n "${PR_BASE}" ]; then
            base="${PR_BASE}"; head="${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base="${PUSH_BEFORE}"; head="${PUSH_AFTER}"
          else
            base="${PUSH_AFTER}^"; head="${PUSH_AFTER}"
          fi
          scripts/ci/denylist-range.sh "${base}" "${head}"
