name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Fetch dependencies
        run: make setup

      - name: "Unsafe pattern grep (raw, safe tuples, String.to_atom, atom keys)"
        run: scripts/ci/unsafe-grep.sh

      - name: make check
        run: make check

      - name: No native libraries in the prod build
        run: scripts/ci/no-native-libs.sh

      - name: Deny-list scan
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -z "${DENYLIST}" ]; then
            echo "::notice::Deny-list secret is not available (fork or not configured): scan skipped."
            exit 0
          fi
          umask 077
          printf '%s\n' "${DENYLIST}" > "${RUNNER_TEMP}/denylist"
          MQTTLENS_DENYLIST="${RUNNER_TEMP}/denylist" scripts/denylist-scan.sh
